<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" href="assets/images/brand/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/images/brand/favicon/favicon.svg">

<body class="error-page">

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Tiendline — Home">
        <img src="assets/images/brand/svg/logo-marca-color-sobre-oscuro.svg" width="40" height="40" alt="Tiendline" loading="eager" decoding="async">
        <span class="brand-name">Tiendline</span>
      </a>

      <div class="header-actions">
        <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch to Spanish">
          <span class="lang-current" aria-hidden="true">EN</span>
          <span class="lang-divider" aria-hidden="true">/</span>
          <span class="lang-next" aria-hidden="true">ES</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="error-card">
        <span class="error-code" aria-hidden="true">404</span>
        <h1 lang-trans="error-title">Page not found</h1>

        <div class="error-actions">
          <a class="btn btn-primary" href="/" lang-trans="error-home">Back to home</a>

        </div>
      </div>
    </div>
  </main>

  <footer class="error-footer">
    <div class="container">
      <p><span aria-hidden="true">©</span> <span id="year">2026</span> Tiendline. <span lang-trans="rights">All rights reserved.</span></p>
    </div>
  </footer>
</body>

</html>
